[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "language-lens"
version = "0.1.0"
description = "A local-first screen OCR and word translation overlay for language learners."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "PySide6>=6.7,<7",
  # Keep the model catalogue used by the upright benchmark reproducible.
  "rapidocr==3.9.2",
  # The project's recommended Windows builds bundle the tested native runtime.
  "tesserocr @ https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.10.0-tesseract-5.5.2/tesserocr-2.10.0-cp310-cp310-win_amd64.whl#sha256=9d94b45219f180ec8db552297d68e79c750aec803a818a2c939a7a99903a7464 ; sys_platform == 'win32' and python_version == '3.10'",
  "tesserocr @ https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.10.0-tesseract-5.5.2/tesserocr-2.10.0-cp311-cp311-win_amd64.whl#sha256=02f75202a13804dacaac111cc4375cdb7b0194217f7f36add30cbb57c37c002c ; sys_platform == 'win32' and python_version == '3.11'",
  "tesserocr @ https://github.com/simonflueckiger/tesserocr-windows_build/releases/download/tesserocr-v2.10.0-tesseract-5.5.2/tesserocr-2.10.0-cp312-cp312-win_amd64.whl#sha256=e05d41a2b0e6f38f3a5195d05a73674d72152a775d1b8ebe481ca9306f94d27a ; sys_platform == 'win32' and python_version == '3.12'",
  "tesserocr==2.10.0 ; sys_platform != 'win32'",
  "pillow>=11.3,<13",
  "python-bidi==0.6.11",
  "onnxruntime>=1.20,<2",
  "argostranslate==1.11.0",
  "minisbd==0.9.5",
  "numpy>=1.26,<3",
  "piper-tts==1.8.0",
  "pydantic>=2,<3",
  "regex>=2024.11.6",
  "filelock==4.0.9",
  "zstandard==0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]
language-packs = ["janome==0.5.0", "jieba==0.42.1", "pyopenjtalk-plus==0.4.1.post9",
                  "sudachipy==0.7.0", "sudachidict-core==20260723.1"]

[project.scripts]
language-lens = "language_lens.app:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["language_lens._translation_assets*"]

[tool.setuptools.package-data]
language_lens = ["data/*.json", "assets/*.svg", "assets/*.ico", "services/*.cjs"]

[tool.setuptools.exclude-package-data]
language_lens = ["_translation_assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

