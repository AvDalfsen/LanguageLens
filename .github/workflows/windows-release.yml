name: Build Windows release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.6"
          architecture: "x64"

      - name: Prepare build environment
        shell: pwsh
        run: |
          python -m venv .release-env

          .\.release-env\Scripts\python.exe -m pip install "pip==26.2.1"

          .\.release-env\Scripts\python.exe -m pip install `
            -r .\packaging\requirements-build.txt

      - name: Determine application version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $versionArguments = @()
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $versionArguments = @("--version", $env:REQUESTED_VERSION)
          }

          $version = & .\.release-env\Scripts\python.exe `
            .\scripts\set-release-version.py @versionArguments

          if ($LASTEXITCODE -ne 0) {
            throw "Could not set the application version."
          }

          "RELEASE_VERSION=$version" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install application and test dependencies
        shell: pwsh
        run: |
          .\.release-env\Scripts\python.exe -m pip install `
            --no-build-isolation `
            -c .\constraints\windows-python310.txt `
            -e ".[dev,language-packs]"

      - name: Run source tests
        shell: pwsh
        run: |
          .\.release-env\Scripts\python.exe -m pytest -q

      - name: Build portable package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\scripts\build-release.ps1 `
            -Python .\.release-env\Scripts\python.exe `
            -UseExistingEnvironment

          $run = Get-ChildItem .\artifacts\releases -Directory |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $run) {
            throw "The release build did not produce an output directory."
          }

          "RUN_ROOT=$($run.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LanguageLens-Windows-${{ github.run_number }}
          retention-days: 14
          path: |
            ${{ env.RUN_ROOT }}/*.zip
            ${{ env.RUN_ROOT }}/*.sha256
            ${{ env.RUN_ROOT }}/verification.json
            ${{ env.RUN_ROOT }}/size-report.md
            ${{ env.RUN_ROOT }}/build.log

      - name: Create draft GitHub release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Run the workflow with an unused version."
          }

          $zip = Get-ChildItem "$env:RUN_ROOT\*.zip" |
            Select-Object -First 1
          $checksum = Get-Item "$($zip.FullName).sha256"

          $publishedJson = gh release list `
            --exclude-drafts --exclude-pre-releases --limit 1 --json tagName

          if ($LASTEXITCODE -ne 0) {
            throw "Could not determine the previous published release."
          }

          $previousRelease = $publishedJson | ConvertFrom-Json | Select-Object -First 1
          $repositoryUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $range = $env:GITHUB_SHA
          $notes = @(
            "## Windows x64 portable preview",
            "",
            "Download **$($zip.Name)**, extract the complete folder, and open **LanguageLens.exe**. No Python, Git, or administrator access is required.",
            "",
            "Choose your languages and use **Download required files** once. Voices are separate optional downloads; capture, translation, and speech then run locally.",
            "",
            "**Update:** Quit Lens from the tray and extract a new complete folder. Existing per-user settings and downloads are retained. Do not mix files from different releases.",
            "",
            "**Known limits:** This preview is unsigned; clean-machine Windows validation remains pending. Desktop and borderless-windowed capture work best. Lens does not pause other apps.",
            "",
            "[Getting started]($repositoryUrl/blob/$tag/docs/getting-started.md) · [Language support]($repositoryUrl/blob/$tag/docs/languages.md) · [Troubleshooting]($repositoryUrl/blob/$tag/docs/troubleshooting.md)",
            "",
            "## Changes",
            "",
            "<!-- Before publishing, replace this comment with a short user-facing summary. -->",
            ""
          )

          if ($previousRelease) {
            $previousTag = $previousRelease.tagName
            git merge-base --is-ancestor "refs/tags/$previousTag" $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "The build commit must include the previous published release $previousTag."
            }
            $range = "refs/tags/$previousTag..$env:GITHUB_SHA"
            $notes += "Changes since $previousTag."
          } else {
            $notes += "Initial release."
          }

          $notes += ""
          $commits = @(git -c i18n.logOutputEncoding=utf-8 log `
            --reverse --format="%H%x09%s" $range)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read commits for the release."
          }

          foreach ($commit in $commits) {
            $sha, $subject = $commit -split "`t", 2
            $subject = [System.Net.WebUtility]::HtmlEncode($subject)
            $subject = $subject -replace '([\\`*_\[\]])', '\$1'
            $shortSha = $sha.Substring(0, 7)
            $notes += "- $subject ([$shortSha]($repositoryUrl/commit/$sha))"
          }

          if ($commits.Count -eq 0) {
            $notes += "No new commits since the previous published release."
          }

          $notes += ""
          if ($previousRelease) {
            $encodedTag = [uri]::EscapeDataString($previousRelease.tagName)
            $notes += "**Full changelog:** $repositoryUrl/compare/$encodedTag...$env:GITHUB_SHA"
          } else {
            $notes += "**Full changelog:** $repositoryUrl/commits/$env:GITHUB_SHA"
          }

          $notesPath = Join-Path $env:RUN_ROOT "release-notes.md"
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8

          gh release create $tag `
            $zip.FullName `
            $checksum.FullName `
            --target $env:GITHUB_SHA `
            --notes-file $notesPath `
            --draft `
            --title "Language Lens $tag"

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub could not create the release."
          }
